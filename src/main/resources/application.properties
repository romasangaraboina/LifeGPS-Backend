spring.application.name=lifegps-backend

# Local development defaults. Override these environment variables for deployment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lifegps_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=Roma_sql@295
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}
server.error.include-message=always
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Override LIFE... via lifegps.jwt.secret env var in deployment. This default is for local development only.
lifegps.jwt.secret=${LIFEGPS_JWT_SECRET:LifeGPSLocalDevelopmentSecretKeyChangeBeforeDeploy2026}
lifegps.jwt.expiration-ms=${LIFEGPS_JWT_EXPIRATION_MS:86400000}
